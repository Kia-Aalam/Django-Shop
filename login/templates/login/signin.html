{% extends 'index.html' %}
{% load static %}

{% block main %}
    <!-- Breadcrumb Start -->
    <div class="container-fluid">
        <div class="row px-xl-5">
            <div class="col-12">
                <nav class="breadcrumb bg-light mb-30">
                    <a class="breadcrumb-item text-dark" href="{% url 'home' %}">Home</a>
                    <span class="breadcrumb-item active">Signin</span>
                </nav>
            </div>
        </div>
    </div>
    <!-- Breadcrumb End -->


    <!-- Signin Start -->
    <div class="container-fluid">
        <h2 class="section-title position-relative text-uppercase text-center mx-xl-5 mb-4"><span class="bg-secondary pr-3">Signin</span></h2>

        <!-- Messages -->
        {% if messages %}
            {% for message in messages %}
            <div id="customAlert" class="custom-alert-overlay">
                <div class="custom-alert-box">
                    <p class="custom-alert-title">Signin failed</p>
                    <p class="custom-alert-text">{{ message }}</p>
                    <div class="custom-alert-actions">
                        <button class="custom-alert-btn" onclick="document.getElementById('customAlert').style.display='none'">OK</button>
                    </div>
                </div>
            </div>
            {% endfor %}
        {% endif %}

        <div class=" px-xl-5">
            <div class=" mb-5 contact-us">
                <div class="contact-form bg-light p-30">
                    <div id="success"></div>

                    <form method="post" action="{% url 'signin' %}">
                        {% csrf_token %}

                        <div class="control-group">
                            {{ form.email }}
                            <p class="help-block text-danger"></p>
                        </div>
                        <div class="control-group">
                            {{ form.password }}
                            <p class="help-block text-danger"></p>
                        </div>
                        <div class="control-group">
                            <a href="{% url 'register' %}">Forget your password or Signup</a>
                            <p class="help-block text-danger"></p>
                        </div>
                        <div>
                            <button class="btn btn-primary py-2 px-4" type="submit">Signin</button>
                        </div>
                    </form>
                </div>
            </div>
           
        </div>
    </div>
    <!-- Signin End -->
{% endblock %}
