{% extends 'index.html' %}
{% load static %}

{% block main %}
    <!-- Breadcrumb Start -->
    <div class="container-fluid">
        <div class="row px-xl-5">
            <div class="col-12">
                <nav class="breadcrumb bg-light mb-30">
                    <a class="breadcrumb-item text-dark" href="{% url 'home' %}">Home</a>
                    <span class="breadcrumb-item active">Search Result</span>
                </nav>
            </div>
        </div>
    </div>
    <!-- Breadcrumb End -->

    <div class="container-fluid pb-5">
        <div class="row px-xl-5">
            <div class="col-lg-5 mb-30">
                <div id="product-carousel" class="carousel slide" data-ride="carousel">
                    <div class="carousel-inner">
                        {% for product in products %}
                            <div class="carousel-item {% if forloop.first %}active{% endif %}">
                                <img class="w-100 h-100" src="{{ product.image.url }}" alt="{{ product.title }}">
                            </div>
                        {% endfor %}
                    </div>
                    <a class="carousel-control-prev" href="#product-carousel" data-slide="prev">
                        <span class="carousel-control-prev-icon"></span>
                    </a>
                    <a class="carousel-control-next" href="#product-carousel" data-slide="next">
                        <span class="carousel-control-next-icon"></span>
                    </a>
                </div>
            </div>
        {% for product in products %}
            <div class="col-lg-3 col-md-4 col-sm-6 mb-4">
                <div class="product-item">
                    <img src="{{ product.image.url }}" class="img-fluid" alt="{{ product.title }}">
                    <h5>{{ product.title }}</h5>
                    <p>${{ product.price }}</p>
                    <a href="{% url 'detail' product.slug %}" class="btn btn-primary">See</a>
                </div>
            </div>
        {% empty %}
            <div class="col-12">
                <p class="text-center">No products found</p>
            </div>
        {% endfor %}
    </div>
{% endblock %}
