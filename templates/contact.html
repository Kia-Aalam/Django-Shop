{% extends 'index.html' %}
{% load static %}

{% block main %}
    <!-- Breadcrumb Start -->
    <div class="container-fluid">
        <div class="row px-xl-5">
            <div class="col-12">
                <nav class="breadcrumb bg-light mb-30">
                    <a class="breadcrumb-item text-dark" href="{% url 'home' %}">Home</a>
                    <span class="breadcrumb-item active">Contact</span>
                </nav>
            </div>
        </div>
    </div>
    <!-- Breadcrumb End -->


    <!-- Contact Start -->
    <div class="container-fluid">
        <h2 class="section-title position-relative text-uppercase text-center mx-xl-5 mb-4"><span class="bg-secondary pr-3">Contact Us</span></h2>
        <div class=" px-xl-5">
            <div class=" mb-5 contact-us">
                <div class="contact-form bg-light p-30">
                    <div id="success"></div>

                    <form method="post" action="{% url 'contact' %}">
                        {% csrf_token %}
                        
                        {% if request.user.is_authenticated %}
                            <div class="control-group">
                                <input type="email" name="email" class="form-control" 
                                value="{{ request.user.email }}" readonly>
                                <p class="help-block text-danger"></p>
                            </div>
                        {% else %}
                            <div class="control-group">
                                {{ form.email }}
                                <p class="help-block text-danger"></p>
                            </div>
                        {% endif %}
                        <div class="control-group">
                            {{ form.subject }}
                            <p class="help-block text-danger"></p>
                        </div>
                        <div class="control-group">
                            {{ form.message }}
                            <p class="help-block text-danger"></p>
                        </div>
                        <div>
                            <button class="btn btn-primary py-2 px-4" type="submit">Send
                                Message</button>
                        </div>
                    </form>
                </div>
            </div>
           
        </div>
    </div>
    <!-- Contact End -->
{% endblock %}
